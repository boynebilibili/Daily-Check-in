<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>打卡卡片</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-font="medium">
  <!-- 每张卡片对应一个打卡项，窗口尺寸 = 卡片尺寸 -->
  <div class="card" id="card">
    <!-- 左上角锁头：点击锁定（禁拖拽），需在配置界面解锁 -->
    <button class="lock" id="lock" title="锁定位置">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="9" rx="2"/>
        <path class="lock-shackle" d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </button>

    <!-- 右上角设置 -->
    <button class="gear" id="gear" title="打开配置">⚙</button>

    <!-- 上方边缘拖拽把手：只有拖动它才能移动卡片 -->
    <div class="drag-handle" id="dragHandle" title="拖动移动位置">
      <span></span><span></span><span></span>
    </div>

    <!-- 内容区：名称 + 统计（目标项）作为一个整体垂直居中 -->
    <div class="content" id="content">
      <div class="main" id="main" title="打卡">
        <div class="big" id="big"></div>
      </div>

      <div class="progress-area hidden" id="progressArea">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="count" id="count"></div>
      </div>
    </div>

    <div class="resize" id="resize" title="拖动调整大小"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
